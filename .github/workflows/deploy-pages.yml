name: Test and deploy calculator

on:
  push:
    branches: [main, fix/qa-review-fixes]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regression and contract tests
        run: node tests/run_all.mjs
      - name: Build atomic release artifact
        run: node scripts/build_release.mjs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build atomic release artifact
        run: node scripts/build_release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .release-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify release SHA and published hashes
        run: node scripts/post_deploy_smoke.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"
